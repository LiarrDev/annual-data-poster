<style>
:root{
  /* ===== 主题色：由 JS 按 theme 注入，这里写的是默认（赤焰）===== */

  --bg-2:#360B10;
  --ink:#FF8A7A;
  --ink-2:#FFC9A8;

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page)}
body{
  font-family:var(--f-ui);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:28px 0 80px;
  overflow-x:hidden;
}
#stage{transform-origin:top center}

/* ============ 海报画布 ============ */
.poster{
  position:relative;
  width:960px;
  background:
    radial-gradient(130% 40% at 50% -6%, rgba(var(--ink-rgb),.13), transparent 62%),
    radial-gradient(110% 30% at 50% 102%, rgba(var(--shadow-rgb),.55), transparent 70%),
    linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 22%, var(--bg) 78%, var(--bg-2) 100%);
  overflow:hidden;
  isolation:isolate;
  padding:0 0 76px;
  box-shadow:0 30px 90px rgba(0,0,0,.7);
}
/* 颗粒质感 */
.poster::before{
  content:"";
  position:absolute;inset:0;
  background-image:var(--noise);
  opacity:.24;
  pointer-events:none;
  z-index:60;
}

/* ============ 通用文字 ============ */
.sec{margin:84px 0 40px;text-align:center}
.sec-t{
  font-family:var(--f-cond);
  font-size:38px;
  line-height:1;
  letter-spacing:.055em;
  color:var(--ink);
  text-transform:uppercase;
  text-shadow:2px 3px 0 rgba(var(--shadow-rgb),.55);
}
.sub{
  font-family:var(--f-cond);
  font-size:23px;
  letter-spacing:.03em;
  color:var(--ink-2);
  text-shadow:1px 2px 0 rgba(var(--shadow-rgb),.5);
}
.big{
  font-family:var(--f-cond);
  color:var(--ink-2);
  letter-spacing:.01em;
  text-shadow:3px 4px 0 rgba(var(--shadow-rgb),.55);
}

/* ============ 封面 ============ */
.hero{position:relative;padding:118px 60px 0;text-align:center}
.hero-kick{
  font-size:12px;letter-spacing:.5em;color:rgba(var(--ink-rgb),.52);
  text-transform:uppercase;margin-bottom:26px;
}
.hero-t{
  font-family:var(--f-disp);
  font-weight:700;
  font-size:74px;
  line-height:1.02;
  color:var(--ink);
  letter-spacing:.005em;
  text-shadow:0 0 26px rgba(var(--hot-rgb),.3), 3px 4px 0 rgba(0,0,0,.35);
}
.hero-t .yr{
  font-size:.86em;
  letter-spacing:.02em;
  color:var(--ink-2);
}
.hero-rule{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin:26px 0 18px;
}
/* 高度至少 2px：1px 的渐变元素会让 html2canvas 生成 0 尺寸画布而导出失败 */
.hero-rule i{display:block;height:2px;width:120px;border-radius:1px;
  background:linear-gradient(90deg,transparent,rgba(var(--ink-rgb),.45),transparent)}
.hero-rule b{color:rgba(var(--ink-rgb),.62);font-size:9px}
.hero-sub{font-size:12.5px;letter-spacing:.22em;color:rgba(var(--ink-rgb),.58)}

/* ============ 环形图 ============ */
.duo{display:flex;justify-content:space-between;padding:0 54px;gap:10px}
.duo-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px}
.dn{position:relative;flex:0 0 auto}
.dn svg{display:block;overflow:visible}
.dn-l{position:absolute;white-space:nowrap;line-height:1.18}
.dn-l .k{display:block;font-size:11px;color:rgba(var(--ink-rgb),.74);letter-spacing:.02em}
.dn-l .v{display:block;font-family:var(--f-cond);font-size:15px;letter-spacing:.02em}
/* 图标标签：图标在上、百分比在下，整体居中 */
.dn-i{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  line-height:1;white-space:nowrap;
}
.dn-i .ic{display:block;width:23px;height:23px}
.dn-i .ic svg{display:block;width:100%;height:100%}
.dn-i .ic img{display:block;width:100%;height:100%;object-fit:contain}
.dn-i .v{font-family:var(--f-cond);font-size:13px;letter-spacing:.03em}
.dn-c{
  position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  text-align:center;pointer-events:none;
}
.dn-c b{display:block;font-family:var(--f-cond);font-size:52px;line-height:.95;color:var(--ink-2);text-shadow:3px 4px 0 rgba(var(--shadow-rgb),.5)}
.dn-c span{display:block;font-family:var(--f-cond);font-size:40px;line-height:1;color:var(--ink-2);text-shadow:3px 4px 0 rgba(var(--shadow-rgb),.5)}
.dn-c em{display:block;font-style:normal;font-size:10px;letter-spacing:.24em;color:rgba(var(--ink-rgb),.5);margin-top:6px}

/* ============ Growth ============ */
.growth{text-align:center;margin:56px 0 8px}
.growth-row{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:14px}
.growth-num{font-family:var(--f-cond);font-size:78px;line-height:.9;color:var(--ink-2);letter-spacing:.01em;text-shadow:4px 5px 0 rgba(var(--shadow-rgb),.5)}
.growth-arrow{margin:8px 0 0 -8px}

/* ============ 地图 ============ */
.map-wrap{position:relative;padding:0 40px}
.map-wrap svg{display:block;width:100%;height:auto}
.map-note{
  margin-top:14px;text-align:center;font-size:10px;letter-spacing:.12em;
  color:rgba(var(--ink-rgb),.46);
}

/* ============ 图表容器 ============ */
.chart{padding:0 52px}
.chart svg{display:block;width:100%;height:auto}

/* ============ Interaction ============ */
.inter{position:relative;height:250px;padding:0 60px}
.polar{
  position:absolute;top:22px;width:150px;height:150px;
  background:var(--panel-3);
  border:3px solid rgba(255,255,255,.84);
  border-bottom-width:16px;
  box-shadow:0 12px 26px rgba(0,0,0,.5);
  overflow:hidden;
}
.polar i{display:block;width:100%;height:100%;background-size:cover;background-position:center}
.polar::after{
  content:"";position:absolute;left:50%;top:-9px;transform:translateX(-50%) rotate(-3deg);
  width:46px;height:16px;background:rgba(255,246,236,.26);backdrop-filter:blur(1px);
  border-left:1px solid rgba(255,255,255,.2);border-right:1px solid rgba(255,255,255,.2);
}
.inter-doodle{position:absolute;inset:0;pointer-events:none}

/* ============ 文章数字 ============ */
.stats{display:flex;justify-content:space-around;padding:0 66px;margin-top:6px}
.stat{display:flex;flex-direction:column;align-items:center;gap:20px}
.stat .k{font-family:var(--f-cond);font-size:23px;letter-spacing:.03em;color:var(--ink-2)}
.stat .b{
  width:150px;height:150px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 34% 30%, var(--ball-hi) 0%, var(--ball-mid) 44%, var(--ball-lo) 72%, rgba(var(--shadow-rgb),0) 100%);
}
.stat .b span{font-family:var(--f-cond);font-size:64px;line-height:1;color:var(--ink-2);text-shadow:2px 3px 0 rgba(var(--shadow-rgb),.5)}

/* ============ Original ============ */
.orig{text-align:center;margin:70px 0 0}
.orig-num{font-family:var(--f-cond);font-size:104px;line-height:.9;color:var(--ink-2);margin-top:18px;text-shadow:4px 5px 0 rgba(var(--shadow-rgb),.5)}

/* ============ Active 圆点 ============ */
.active-grid{
  display:grid;gap:20px;margin:0 auto;justify-content:center;
  padding:34px 44px;border-radius:8px;
  background:radial-gradient(70% 80% at 50% 50%, rgba(var(--hot-rgb),.3), rgba(var(--shadow-rgb),0) 72%);
}
.dot{
  width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%, rgba(var(--dot-hi),var(--a)) 0%, rgba(var(--dot-mid),calc(var(--a)*.6)) 34%, rgba(var(--dot-lo),.88) 76%);
  box-shadow:0 0 18px rgba(var(--hot-rgb),calc(var(--a)*.55));
}

/* ============ 文章阅读 ============ */
.av-stage{position:relative;height:380px;margin:0 52px}
.av-strip{position:absolute;left:0;right:0;bottom:0;height:150px;display:flex;gap:7px}
.av-thumb{flex:1;overflow:hidden;opacity:.26}
.av-thumb i{display:block;width:100%;height:100%;background-size:cover;background-position:center}
.av-bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:7px}
.av-b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.av-b span{font-family:var(--f-cond);font-size:14px;color:var(--ink-2);margin-bottom:6px;letter-spacing:.03em}
.av-bar{
  width:27px;border-radius:3px 3px 0 0;
  background:linear-gradient(180deg,var(--hot),var(--hot-2));
  box-shadow:0 0 14px rgba(var(--hot-rgb),.32);
}
.av-labs{display:flex;gap:7px;margin:12px 52px 0}
.av-lab{
  flex:1;font-size:10.5px;color:rgba(var(--ink-rgb),.72);line-height:1.3;
  writing-mode:vertical-rl;transform:rotate(180deg);
  height:124px;overflow:hidden;
}

/* ============ 页脚 ============ */
.foot{
  display:flex;flex-direction:column;align-items:center;gap:22px;
  margin-top:92px;
}
.foot-row{display:flex;align-items:center;justify-content:center;gap:34px}
.foot-av{
  width:78px;height:78px;border-radius:50%;overflow:hidden;
  border:2px solid rgba(var(--ink-rgb),.36);
  background:radial-gradient(circle at 40% 35%, var(--ball-hi), var(--ball-lo));
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:rgba(var(--ink-rgb),.92);letter-spacing:.1em;
  text-shadow:0 1px 3px rgba(0,0,0,.45);
}
.foot-av img{width:100%;height:100%;object-fit:cover;display:block}
.foot-qr{
  width:96px;height:96px;border-radius:4px;overflow:hidden;
  background:rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;color:rgba(var(--ink-rgb),.72);letter-spacing:.16em;
  border:1px dashed rgba(var(--ink-rgb),.4);
}
.foot-qr img{width:100%;height:100%;object-fit:cover;display:block}
.foot-tx{font-size:11px;line-height:1.9;letter-spacing:.2em;color:rgba(var(--ink-rgb),.5)}

/* ============ 控制台 UI ============ */
.ui{position:fixed;right:22px;bottom:22px;display:flex;gap:10px;z-index:999}
.ui button{
  font-family:var(--f-ui);
  padding:11px 20px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line-2);
  background:rgba(20,20,22,.92);
  color:var(--ui);font-size:13px;letter-spacing:.06em;
  backdrop-filter:blur(10px);
  transition:.18s;
}
.ui button:hover{background:var(--panel-3);border-color:rgba(255,255,255,.3);color:#fff}
.ui button.primary{background:linear-gradient(135deg,var(--hot),var(--hot-2));border-color:transparent;color:#fff}
.ui button.primary:hover{filter:brightness(1.12)}
.ui button[disabled]{opacity:.5;cursor:progress}

.drawer{
  position:fixed;top:0;right:0;bottom:0;width:560px;max-width:94vw;z-index:1000;
  background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;
  transform:translateX(102%);transition:transform .28s ease;
  box-shadow:-30px 0 60px rgba(0,0,0,.6);
  color:var(--ui);
}
.drawer.on{transform:none}
.drawer-h{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--line);
  font-size:13px;letter-spacing:.08em;color:var(--ui);
}
.drawer-h b{font-weight:600}
.drawer-h em{display:block;font-style:normal;font-size:11px;color:var(--ui-3);margin-top:4px;letter-spacing:.04em}
.drawer-h button{background:none;border:none;color:var(--ui-2);font-size:22px;line-height:1;cursor:pointer;padding:0 4px}
.drawer-help{
  padding:12px 18px;border-bottom:1px solid var(--line);
  font-size:11px;line-height:1.85;color:var(--ui-3);
}
.drawer-help div{margin:0 0 3px}
.drawer-help code{
  font-family:ui-monospace,Menlo,monospace;font-size:10.5px;
  color:var(--ui-2);background:rgba(255,255,255,.07);
  padding:0 4px;border-radius:3px;white-space:nowrap;display:inline-block;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;
}
.drawer textarea{
  flex:1;margin:14px 16px;padding:14px;border-radius:8px;
  background:#0B0B0D;color:#D8D8DE;border:1px solid var(--line);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.65;
  resize:none;outline:none;
}
.drawer textarea:focus{border-color:var(--line-2)}
.drawer-f{display:flex;align-items:center;gap:10px;padding:0 16px 18px}
.drawer-f button{
  padding:9px 18px;border-radius:6px;cursor:pointer;font-size:12.5px;letter-spacing:.05em;
  border:1px solid var(--line-2);background:transparent;color:var(--ui);
}
.drawer-f button.primary{background:var(--hot);border-color:transparent;color:#fff}
.drawer-f span{margin-left:auto;font-size:11.5px;color:var(--ui-2);letter-spacing:.04em}

/* ---------- 表单 / JSON 两个页签 ---------- */
.tabs{display:flex;gap:4px;padding:12px 16px 0;border-bottom:1px solid var(--line);flex:none}
.tab{
  padding:8px 16px 9px;border:1px solid transparent;border-bottom:none;border-radius:7px 7px 0 0;
  background:transparent;color:var(--ui-3);font-family:var(--f-ui);
  font-size:12.5px;letter-spacing:.06em;cursor:pointer;transition:.16s;
}
.tab:hover{color:var(--ui-2)}
.tab.on{background:var(--panel-2);border-color:var(--line);color:var(--ui)}
.pane{display:none;flex:1;min-height:0;flex-direction:column}
.pane.on{display:flex}
.form{flex:1;overflow-y:auto;padding:2px 16px 16px;scrollbar-width:thin}
.form::-webkit-scrollbar{width:9px}
.form::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:5px}
.form::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.24)}

.f-sec{border-bottom:1px solid var(--line)}
.f-sec>summary{
  display:flex;align-items:center;gap:8px;padding:13px 2px;cursor:pointer;list-style:none;
  font-size:12.5px;letter-spacing:.05em;color:var(--ui-2);
}
.f-sec>summary::-webkit-details-marker{display:none}
.f-sec>summary:before{content:'▸';display:inline-block;color:var(--ui-3);transition:transform .18s;font-size:10px}
.f-sec[open]>summary:before{transform:rotate(90deg)}
.f-sec>summary:hover{color:var(--ui)}
.f-sec>summary em{margin-left:auto;font-style:normal;font-size:10.5px;color:var(--ui-3);letter-spacing:.04em}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding:2px 0 18px}
.f-grid>.full{grid-column:1/-1;min-width:0}
.fld{display:flex;flex-direction:column;gap:5px;font-size:10.5px;letter-spacing:.06em;color:var(--ui-2);min-width:0}
.fld>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-in{
  width:100%;box-sizing:border-box;padding:7px 9px;border-radius:5px;
  background:#0B0B0D;color:#D8D8DE;border:1px solid var(--line);
  font-family:var(--f-ui);font-size:12px;outline:none;transition:.15s;
}
.f-in:focus{border-color:rgba(255,255,255,.3);background:#111114}
.f-in::placeholder{color:var(--ui-3)}
.f-num{text-align:right;font-variant-numeric:tabular-nums}
.f-col{
  width:100%;height:30px;padding:0 2px;border-radius:5px;cursor:pointer;
  background:#0B0B0D;border:1px solid var(--line);
}
.f-sel{
  padding:6px 4px;font-size:11px;cursor:pointer;color:#D8D8DE;
  background:#0B0B0D;-webkit-appearance:none;appearance:none;text-align:center;
}
.f-nums{
  width:100%;box-sizing:border-box;min-height:48px;resize:vertical;
  padding:8px 9px;border-radius:5px;background:#0B0B0D;color:#D8D8DE;
  border:1px solid var(--line);outline:none;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.7;
}
.f-nums:focus{border-color:rgba(255,255,255,.3);background:#111114}
.f-hint{display:block;margin-top:4px;font-style:normal;font-size:10px;line-height:1.6;
  color:var(--ui-3);letter-spacing:.03em}

/* ---------- 配色主题选择 ---------- */
.theme-row{display:flex;gap:7px;flex-wrap:wrap;padding:2px 0 10px}
.theme-chip{
  width:60px;height:56px;border-radius:7px;cursor:pointer;position:relative;
  border:1px solid var(--line);overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  transition:.16s;
}
.theme-chip:hover{border-color:rgba(255,255,255,.34)}
.theme-chip.on{border-color:rgba(255,255,255,.62);box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.theme-chip b{font-size:9px;font-weight:500;letter-spacing:.06em}
.theme-chip i{display:block;width:18px;height:18px;border-radius:50%}
.theme-tip{font-size:10px;line-height:1.7;color:var(--ui-3);padding:0 0 14px;letter-spacing:.03em}

/* ---------- 分段行 ---------- */
.seg-row{display:grid;grid-template-columns:30px 1fr 70px 24px;gap:6px;align-items:center;margin-bottom:6px}
.seg-row.has-icon{grid-template-columns:30px 1fr 64px 74px 24px}
.row-del{
  width:24px;height:24px;border-radius:5px;cursor:pointer;font-size:14px;line-height:1;
  border:1px solid var(--line);background:transparent;color:var(--ui-3);
}
.row-del:hover{background:rgba(255,80,80,.14);border-color:rgba(255,120,120,.4);color:#FF9A9A}
.row-add{
  margin:2px 0 2px;padding:6px 12px;border-radius:5px;cursor:pointer;font-family:var(--f-ui);
  border:1px dashed var(--line-2);background:transparent;color:var(--ui-2);font-size:11.5px;
}
.row-add:hover{background:rgba(255,255,255,.06);color:var(--ui)}

/* ---------- 省份格 ---------- */
.pv-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:2px}
.pv{display:flex;align-items:center;gap:8px}
.pv>span{flex:1;min-width:0;font-size:11px;color:var(--ui-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv>.f-in{width:62px;flex:none;padding:4px 6px;font-size:11.5px}

/* ---------- 图片字段 ---------- */
.imgf{display:flex;gap:9px;align-items:flex-start}
.imgf-thumb{
  width:44px;height:44px;flex:none;border-radius:5px;cursor:pointer;
  background:#0B0B0D center/cover no-repeat;
  border:1px dashed var(--line-2);
  display:flex;align-items:center;justify-content:center;
  font-size:9px;color:var(--ui-3);letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;
}
.imgf-thumb:hover{border-color:rgba(255,255,255,.36)}
.imgf-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.imgf-btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mini{
  padding:5px 10px;border-radius:5px;cursor:pointer;font-family:var(--f-ui);
  border:1px solid var(--line-2);background:transparent;color:var(--ui-2);font-size:11px;
}
.mini:hover{background:rgba(255,255,255,.07);color:var(--ui)}

/* ---------- 文章行 ---------- */
.avr{display:grid;grid-template-columns:40px 1fr 76px 24px;gap:7px;align-items:center;margin-bottom:7px}
.avr-thumb{
  width:40px;height:40px;border-radius:5px;cursor:pointer;
  background:#0B0B0D center/cover no-repeat;
  border:1px dashed var(--line-2);
  display:flex;align-items:center;justify-content:center;
  font-size:9px;color:var(--ui-3);white-space:nowrap;
}
.avr-thumb:hover{border-color:rgba(255,255,255,.36)}


@media print{
  body{padding:0;background:#fff}
  #stage{transform:none!important}
  .ui,.drawer{display:none!important}
  @page{margin:0}
}
</style>
</head>
<body>
<div id="stage"><div class="poster" id="poster"></div></div>

<div class="ui">
  <button id="btnData">编辑数据</button>
  <button id="btnPng">PNG</button>
  <button id="btnJpg" class="primary">下载图片</button>
</div>

<div class="drawer" id="drawer">
  <div class="drawer-h">
    <div><b>编辑数据</b><em>表单改完自动重绘；数值和图片都存在本机浏览器里</em></div>
    <button id="btnClose" title="关闭">&times;</button>
  </div>

  <div class="tabs">
    <button class="tab on" data-tab="form">可视化</button>
    <button class="tab" data-tab="json">JSON</button>
  </div>

  <div class="pane on" id="paneForm">
    <div class="form" id="formBody"></div>
  </div>

  <div class="pane" id="paneJson">
    <div class="drawer-help">
      <div><code>theme</code> 换配色：<code>ember</code> <code>abyss</code> <code>jade</code> <code>violet</code> <code>amber</code> <code>graphite</code> <code>sakura</code> <code>aurora</code> <code>neon</code>；删掉则按年份自动</div>
      <div><code>gender / os</code> 某项填 <code>icon</code> 就是图标标签：<code>male</code> <code>female</code> <code>other</code> <code>android</code> <code>apple</code> <code>mobile</code> <code>tablet</code> <code>desktop</code>，也可填图片 URL 或整段 SVG</div>
      <div>扇形/柱子的数值填百分比或人数都行，会自动归一到 100%</div>
      <div>图片字段可填 URL，也可在「可视化」里直接选本地图（会自动压缩内嵌）</div>
      <div>支持 <code>//</code> 注释和末尾多余逗号</div>
    </div>
    <textarea id="ta" spellcheck="false"></textarea>
  </div>

  <div class="drawer-f">
    <button id="btnApply" class="primary">应用</button>
    <button id="btnReset">恢复示例</button>
    <span id="msg"></span>
  </div>

const hexRGB = h => {
  let v = String(h || '').replace('#', '');
  if (v.length === 3) v = v.split('').map(c => c + c).join('');
  return [0, 2, 4].map(i => parseInt(v.substr(i, 2), 16) || 0).join(',');
};

function autoTheme(year) {
  const y = Number(year) || new Date().getFullYear();
  const i = ((y - 2025) % THEME_KEYS.length + THEME_KEYS.length) % THEME_KEYS.length;
  return THEME_KEYS[i];
}

/* 换主题时把数据里的色板色整体平移，用户自定义的颜色不动 */
function recolorData(from, to) {
  const map = new Map();
  from.pal.forEach((c, i) => map.set(String(c).toLowerCase(), to.pal[i]));
  const paint = arr => {
    if (!Array.isArray(arr)) return;
    arr.forEach(it => {
      if (!it || !it.color) return;
      const hit = map.get(String(it.color).toLowerCase());
      if (hit) it.color = hit;
    });
  };
  const f = DATA && DATA.followers;
  if (f) ['gender', 'os', 'language', 'age'].forEach(k => paint(f[k]));
  if (DATA && DATA.sources) paint(DATA.sources.data);
  if (DATA) paint(DATA.classification);
}

/* 缺色的数据项按槽位补色：颜色为 undefined 时 JSON 存储会丢掉该字段，旧数据需要自愈 */
function healColors(d) {
  const paint = arr => {
    if (!Array.isArray(arr)) return;
    arr.forEach((it, i) => { if (it && !it.color) it.color = T.pal[i % T.pal.length]; });
  };
  const f = d.followers;
  if (f) ['gender', 'os', 'language', 'age'].forEach(k => paint(f[k]));
  if (d.sources) paint(d.sources.data);
  paint(d.classification);
}

function applyTheme(key) {
  key = THEMES[key] ? key : 'ember';
  const from = THEMES[curTheme], to = THEMES[key];
  if (key !== curTheme) recolorData(from, to);
  curTheme = key;
  T = to;
  PAL_KEYS.forEach((k, i) => { P[k] = to.pal[i]; });

  const r = document.documentElement.style;
  const put = (k, v) => r.setProperty(k, v);
  put('--bg', to.bg);
  put('--bg-2', to.bg2);
  put('--ink', to.ink);
  put('--ink-2', to.ink2);
  put('--dim', to.dim);
  put('--ink-rgb', to.inkRGB);
  put('--shadow-rgb', to.shadowRGB);
  put('--hot', to.hot);
  put('--hot-2', to.hot2);
  put('--hot-rgb', hexRGB(to.hot));
  put('--mark', to.mark);
  put('--mark-rgb', hexRGB(to.mark));
  // 由主题色算出的派生色：球体、活跃圆点
  put('--ball-hi', mixHex(to.bg, to.ink, .62));
  put('--ball-mid', mixHex(to.bg, to.ink, .42));
  put('--ball-lo', mixHex(to.bg, to.hot, .26));
  put('--dot-hi', hexRGB(mixHex(to.ink2, '#ffffff', .18)));
  put('--dot-mid', hexRGB(mixHex(to.hot, to.ink, .42)));
  put('--dot-lo', hexRGB(mixHex(to.bg, to.hot, .38)));
  put('--page', mixHex(to.bg, '#000000', .62));
}

function demoDaily(){
  // 365 天，中间一次爆款，其余是日常波动
  let seed = 20250101;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const arr = [];
  for (let i = 0; i < 365; i++) {
    let v = 6 + Math.pow(rnd(), 2.2) * 46;
    if (i > 40 && i < 46) v += 120;
    if (i === 57) v = 2380;
    if (i > 57 && i < 64) v += 260 - (i - 57) * 40;
    if (i > 300 && i < 340) v *= 1.9;
    if (rnd() > 0.93) v += 110;
    arr.push(Math.round(v));
  }
  return arr;
}

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => Number(n || 0).toLocaleString('en-US');
const p1  = n => (Math.round(n * 10) / 10).toFixed(1);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sum = a => a.reduce((x, y) => x + Math.max(0, +y.value || 0), 0) || 1;

function mixHex(a, b, t) {
  const pa = [1, 3, 5].map(i => parseInt(a.substr(i, 2), 16));
  const pb = [1, 3, 5].map(i => parseInt(b.substr(i, 2), 16));
  return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
function ramp(t) {
  const st = [[0, T.ramp[0]], [0.28, T.ramp[1]], [0.55, T.ramp[2]], [0.78, T.ramp[3]], [1, T.ramp[4]]];
  t = clamp(t, 0, 1);
  for (let i = 1; i < st.length; i++) {
    if (t <= st[i][0]) return mixHex(st[i - 1][1], st[i][1], (t - st[i - 1][0]) / (st[i][0] - st[i - 1][0]));
  }
  return st[st.length - 1][1];
}

/* ---------- 环形图（带引线标签） ---------- */
function donutHTML(segs, o = {}) {
  segs = segs.filter(s => +s.value > 0);
  const ring  = o.ring  || 160;
  const thick = o.thick || 24;
  const total = sum(segs);
  const gap   = segs.length > 1 ? (o.gap == null ? 3 : o.gap) : 0;
  const lg    = o.labelGap == null ? 22 : o.labelGap;
  // 标签宽度：中文按 11.2px、西文按 6.6px 估，避免长中文压到圆环上
  const tw = s => {
    let w = 0;
    for (const ch of String(s.label || '')) w += /[\u4e00-\u9fa5\u3000-\u303f]/.test(ch) ? 11.2 : 6.6;
    return w;
  };
  const estW  = Math.max(30, ...segs.map(s => s.icon ? 36 : tw(s)));
  const pad   = o.pad != null ? o.pad : Math.round(lg + estW + 12);
  const size  = ring + pad * 2;
  const cx = size / 2, cy = size / 2;
  const r = (ring - thick) / 2;
  const C = 2 * Math.PI * r;
  const rOut = r + thick / 2;

  let acc = 0, arcs = '', labs = [];
  segs.forEach(s => {
    const frac = Math.max(0, +s.value) / total;
    const len = Math.max(1.2, frac * C - gap);
    arcs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}"
      stroke-width="${thick}" stroke-dasharray="${len.toFixed(2)} ${(C - len + 0.6).toFixed(2)}"
      stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    const mid = ((acc + frac * C / 2) / C) * 360 - 90;
    const rad = mid * Math.PI / 180;
    const cos = Math.cos(rad), sin = Math.sin(rad);
    labs.push({ s, frac, cos, sin, ax: cx + cos * rOut, ay: cy + sin * rOut, y: cy + sin * rOut });
    acc += frac * C;
  });

  // 左右两列分布 + 纵向去重叠
  const iconMode = segs.some(s => s.icon);
  const minGap = o.minGap || (iconMode ? 46 : 42);
  const vPad = iconMode ? 19 : 13;
  ['L', 'R'].forEach(side => {
    const g = labs.filter(l => (side === 'L' ? l.cos < 0 : l.cos >= 0)).sort((a, b) => a.y - b.y);
    g.forEach((l, i) => {
      l.side = side;
      if (i && l.y - g[i - 1].y < minGap) l.y = g[i - 1].y + minGap;
    });
    if (g.length) {
      const over = g[g.length - 1].y - (size - vPad);
      if (over > 0) g.forEach(l => l.y -= over);
      const under = vPad - g[0].y;
      if (under > 0) g.forEach(l => l.y += under);
    }
  });

  let lines = '', labels = '';
  labs.forEach(l => {
    const dir = l.side === 'R' ? 1 : -1;
    const isIcon = !!l.s.icon;
    // 图标标签是居中的一列，锚点再往外让出半个图标宽
    const lx = cx + dir * (rOut + lg + (isIcon ? 17 : 0));
    const mid = cx + dir * (rOut + lg * 0.5);
    // 指示线跟扇区同色：暗底上细点线几乎看不见，实线 + 实心锚点才能一眼对应到扇区
    const col = l.s.color || T.ink;
    lines += `<path d="M${l.ax.toFixed(1)} ${l.ay.toFixed(1)} L${mid.toFixed(1)} ${l.ay.toFixed(1)} L${mid.toFixed(1)} ${l.y.toFixed(1)} L${(lx - dir * (isIcon ? 15 : 4)).toFixed(1)} ${l.y.toFixed(1)}"
      fill="none" stroke="${col}" stroke-opacity=".75" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>`;
    lines += `<circle cx="${l.ax.toFixed(1)}" cy="${l.ay.toFixed(1)}" r="2.3" fill="${col}" stroke="${T.bg}" stroke-width="1"/>`;

    if (isIcon) {
      labels += `<div class="dn-i" style="left:${lx.toFixed(1)}px;top:${l.y.toFixed(1)}px">
        ${iconSVG(l.s.icon, l.s.color)}
        <span class="v" style="color:${l.s.color}">${p1(l.frac * 100)}%</span></div>`;
      return;
    }
    const align = dir > 0 ? 'left' : 'right';
    const tx = dir > 0 ? `translateY(-50%)` : `translate(-100%,-50%)`;
    labels += `<div class="dn-l" style="left:${lx.toFixed(1)}px;top:${l.y.toFixed(1)}px;transform:${tx};text-align:${align}">
      <span class="k">${esc(l.s.label)}</span><span class="v" style="color:${l.s.color}">${p1(l.frac * 100)}%</span></div>`;
  });

  const outer = o.outerRing
    ? `<circle cx="${cx}" cy="${cy}" r="${rOut + 7}" fill="none" stroke="rgba(${T.inkRGB},.18)" stroke-width="1" stroke-dasharray="1 5"/>`
    : '';

  // 方形容器左右需要留标签位，纵向用负 margin 收掉多余留白
  const vTrim = Math.round(clamp((pad - 24) * 0.8, 0, 70));
  return `<div class="dn" style="width:${size}px;height:${size}px;margin:${-vTrim}px 0">
    <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
      ${outer}${arcs}${lines}
    </svg>
    ${o.center || ''}${labels}
  </div>`;
}

/* ---------- 折线 / 面积图 ---------- */
function areaChart(values, o = {}) {
  const W = o.w || 856, H = o.h || 260;
  const padL = 6, padR = 6, padT = 18, padB = 26;
  const n = values.length;
  const max = Math.max(...values, 1) * 1.08;
  const X = i => padL + (W - padL - padR) * (n === 1 ? .5 : i / (n - 1));
  const Y = v => H - padB - (H - padT - padB) * (v / max);
  let d = '', a = `M ${padL} ${H - padB} `;
  values.forEach((v, i) => {
    const x = X(i).toFixed(1), y = Y(v).toFixed(1);
    d += (i ? 'L' : 'M') + x + ' ' + y + ' ';
    a += 'L' + x + ' ' + y + ' ';
  });
  a += `L ${(W - padR).toFixed(1)} ${H - padB} Z`;

  let ticks = '';
  const labels = o.labels || [];
  if (labels.length) {
    const step = Math.max(1, Math.floor(n / labels.length));
    labels.forEach((t, i) => {
      const x = X(Math.min(n - 1, i * step));
      ticks += `<line x1="${x.toFixed(1)}" y1="${H - padB}" x2="${x.toFixed(1)}" y2="${H - padB + 4}" stroke="rgba(${T.inkRGB},.32)" stroke-width="1"/>`;
      ticks += `<text x="${x.toFixed(1)}" y="${H - 8}" fill="rgba(${T.inkRGB},.5)" font-size="9.5" text-anchor="middle" font-family="PingFang SC,Helvetica,sans-serif">${esc(t)}</text>`;
    });
  }

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${T.hot}" stop-opacity=".58"/>
        <stop offset=".55" stop-color="${T.hot2}" stop-opacity=".5"/>
        <stop offset="1" stop-color="${T.bg}" stop-opacity=".08"/>
      </linearGradient>
    </defs>
    <path d="${a}" fill="url(#ag)"/>
    <path d="${d}" fill="none" stroke="${T.hot}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="rgba(${T.inkRGB},.26)" stroke-width="1" stroke-dasharray="3 4"/>
    ${ticks}
  </svg>`;
}

/* ---------- 柱状图 ---------- */
function barChart(items, o = {}) {
  const W = o.w || 856, H = o.h || 300;
  const padB = 74, padT = 34, padL = 10, padR = 10;
  const max = Math.max(...items.map(i => +i.value || 0), 1) * 1.15;
  const slot = (W - padL - padR) / Math.max(1, items.length);
  const bw = Math.min(o.barW || 34, slot * 0.42);
  let bars = '';
  items.forEach((it, i) => {
    const h = Math.max(3, (H - padB - padT) * ((+it.value || 0) / max));
    const x = padL + slot * i + (slot - bw) / 2;
    const y = H - padB - h;
    const c = it.color || T.pal[6];
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${c}" opacity=".95"/>`;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="6" rx="3" fill="#fff" opacity=".2"/>`;
    bars += `<text x="${(x + bw / 2).toFixed(1)}" y="${(y - 9).toFixed(1)}" fill="${T.ink2}" font-size="15" text-anchor="middle" font-family="Haettenschweiler,Impact,sans-serif">${esc(it.value)}</text>`;
    bars += `<text transform="translate(${(x + bw / 2).toFixed(1)},${H - padB + 16}) rotate(-38)" fill="rgba(${T.inkRGB},.72)" font-size="11" text-anchor="end" font-family="PingFang SC,Helvetica,sans-serif">${esc(it.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}">
    <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="rgba(${T.inkRGB},.26)" stroke-width="1" stroke-dasharray="3 4"/>
    ${bars}
  </svg>`;
}

/* ---------- 地图 ---------- */
let GEO = null;
function normName(s) {
  return String(s || '').replace(/(省|市|自治区|特别行政区|壮族|回族|维吾尔|自治州)/g, '');
}
function mapHTML(d) {
  const feats = (GEO && GEO.features) || [];
  if (!feats.length) return '';
  const W = 880, H = 540, PAD = 6;
  // 墨卡托投影：经纬度统一换算成弧度，否则纵向会被压扁
  const proj = (lon, lat) => [lon * Math.PI / 180, Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360))];

  const isJD = f => String(f.properties.adcode) === '100000_JD';
  const main = feats.filter(f => !isJD(f) && f.properties.name);
  const CLIP_LAT = 17.4; // 主图只画到海南岛，南海诸岛单独做插图
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  const eachPt = (geom, fn) => {
    const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
    polys.forEach(poly => poly.forEach(ring => ring.forEach(pt => {
      if (pt[1] <= CLIP_LAT) return;
      const [x, y] = proj(pt[0], pt[1]); fn(x, y);
    })));
  };
  main.forEach(f => eachPt(f.geometry, (x, y) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }));

  const sx = (W - PAD * 2) / (x1 - x0);
  const sy = (H - PAD * 2) / (y1 - y0);
  const s = Math.min(sx, sy);
  const ox = (W - (x1 - x0) * s) / 2 - x0 * s;
  const oy = (H - (y1 - y0) * s) / 2 - y0 * s;
  // 注意：SVG 的 y 向下增长，墨卡托 y 向上增长，所以要翻过来
  const px = (lon, lat) => { const [x, y] = proj(lon, lat); return [x * s + ox, H - (y * s + oy)]; };
  const clipY = px(0, CLIP_LAT)[1];

  const dataMap = new Map();
  (d.province.data || []).forEach(it => dataMap.set(normName(it.name), +it.value || 0));
  const maxV = Math.max(...dataMap.values(), 0.0001);

  // 省份路径
  let paths = '';
  const centres = [];
  main.forEach(f => {
    const v = dataMap.get(normName(f.properties.name)) || 0;
    const fill = v <= 0 ? T.empty : ramp(Math.pow(v / maxV, 0.62));
    let dd = '';
    const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
    polys.forEach(poly => poly.forEach(ring => {
      dd += 'M' + ring.map(pt => { const [X, Y] = px(pt[0], pt[1]); return X.toFixed(1) + ' ' + Y.toFixed(1); }).join('L') + 'Z';
    }));
    paths += `<path d="${dd}" fill="${fill}" stroke="rgba(${T.inkRGB},.2)" stroke-width=".7" stroke-linejoin="round"/>`;
    if (v > 0) {
      const c = f.properties.centroid || f.properties.center;
      if (c) centres.push({ name: f.properties.name, short: normName(f.properties.name), v, xy: px(c[0], c[1]) });
    }
  });

  // 标签（仅前 N 个），向外推开并做简单避让
  centres.sort((a, b) => b.v - a.v);
  const topN = d.province.labelTop == null ? 8 : d.province.labelTop;
  const cx0 = W / 2, cy0 = H / 2;
  const boxes = [];
  centres.slice(0, topN).forEach(c => {
    const [mx, my] = c.xy;
    const dx = mx - cx0, dy = my - cy0;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    boxes.push({
      c, mx, my,
      lx: clamp(mx + ux * 30, 34, W - 34),
      ly: clamp(my + uy * 20, 14, H - 14),
      anchor: ux > 0.28 ? 'start' : (ux < -0.28 ? 'end' : 'middle')
    });
  });
  boxes.sort((a, b) => a.ly - b.ly);
  for (let i = 1; i < boxes.length; i++) {
    const prev = boxes[i - 1], cur = boxes[i];
    if (Math.abs(cur.lx - prev.lx) < 96 && cur.ly - prev.ly < 15) cur.ly = prev.ly + 15;
  }

  let marks = '';
  boxes.forEach(b => {
    marks += `<circle cx="${b.mx.toFixed(1)}" cy="${b.my.toFixed(1)}" r="3.2" fill="none" stroke="${T.mark}" stroke-width="1.1"/>`;
    marks += `<line x1="${b.mx.toFixed(1)}" y1="${b.my.toFixed(1)}" x2="${b.lx.toFixed(1)}" y2="${b.ly.toFixed(1)}" stroke="rgba(${hexRGB(T.mark)},.42)" stroke-width=".7" stroke-dasharray="1.4 2.4"/>`;
    marks += `<text x="${b.lx.toFixed(1)}" y="${(b.ly + 3).toFixed(1)}" fill="${T.mark}" font-size="10.5" text-anchor="${b.anchor}" font-family="PingFang SC,Helvetica,sans-serif">${esc(b.c.short)} ${p1(b.c.v)}%</text>`;
  });
  // 其余省份只留小点
  centres.slice(topN).forEach(c => {
    marks += `<circle cx="${c.xy[0].toFixed(1)}" cy="${c.xy[1].toFixed(1)}" r="1.6" fill="${T.mark}" opacity=".65"/>`;
  });

  // 南海诸岛插图（独立投影，符合地图规范）
  const jd = feats.find(isJD);
  let inset = '';
  if (jd) {
    let a0 = 1e9, a1 = -1e9, b0 = 1e9, b1 = -1e9;
    const allPolys = jd.geometry.type === 'Polygon' ? [jd.geometry.coordinates] : jd.geometry.coordinates;
    allPolys.forEach(poly => poly.forEach(ring => ring.forEach(pt => {
      const [x, y] = proj(pt[0], pt[1]);
      a0 = Math.min(a0, x); a1 = Math.max(a1, x); b0 = Math.min(b0, y); b1 = Math.max(b1, y);
    })));
    const iw = 112, ih = 156, ix0 = W - iw - 24, iy0 = H - ih - 6;
    const s2 = Math.min((iw - 12) / (a1 - a0), (ih - 26) / (b1 - b0));
    const bx = ix0 + (iw - (a1 - a0) * s2) / 2;
    const by = iy0 + ((ih - 18) - (b1 - b0) * s2) / 2 + 6;
    let dp = '';
    allPolys.forEach(poly => poly.forEach(ring => {
      dp += 'M' + ring.map(pt => {
        const [x, y] = proj(pt[0], pt[1]);
        return (bx + (x - a0) * s2).toFixed(1) + ' ' + (by + (b1 - y) * s2).toFixed(1);
      }).join('L') + 'Z';
    }));
    inset = `<g>
      <rect x="${ix0}" y="${iy0}" width="${iw}" height="${ih}" fill="${mixHex(T.bg, '#000000', .5)}" stroke="rgba(${hexRGB(T.mark)},.42)" stroke-width=".8"/>
      <path d="${dp}" fill="${T.ramp[2]}" stroke="rgba(${hexRGB(T.mark)},.32)" stroke-width=".5"/>
      <text x="${ix0 + iw / 2}" y="${iy0 + ih - 6}" fill="rgba(${T.inkRGB},.72)" font-size="8.5" text-anchor="middle" font-family="PingFang SC,sans-serif">南海诸岛</text>
    </g>`;
  }

  return `<svg viewBox="0 0 ${W} ${H}">
    <defs><clipPath id="mapclip"><rect x="0" y="0" width="${W}" height="${clipY.toFixed(1)}"/></clipPath></defs>
    <g clip-path="url(#mapclip)">${paths}</g>
    <g>${inset}</g>
    <g>${marks}</g>
  </svg>`;
}

/* 图片位缺省时的占位：用当前主题的暗调色，不会跟配色打架 */
function phGrad(i, deg) {

  const a = mixHex(T.bg, tones[i % 4], .46 + (i % 3) * .07);
  const b = mixHex(T.bg, tones[(i + 2) % 4], .22);
  return `linear-gradient(${deg || 150}deg, ${a}, ${b} 56%, ${T.bg})`;
}

/* ---------- 自适应缩放 ---------- */
function fit() {
  const stage = document.getElementById('stage');
  const poster = document.getElementById('poster');
  const drawer = document.getElementById('drawer');
  const dw = drawer && drawer.classList.contains('on')
    ? Math.min(drawer.offsetWidth || 560, window.innerWidth * 0.94) : 0;
  const avail = window.innerWidth - 40 - dw;
  const s = Math.max(0.16, Math.min(1, avail / 960));
  // 抽屉展开时把海报整体往左让开，避免被压在抽屉下面
  stage.style.transform = dw ? `translateX(${-dw / 2}px) scale(${s})` : `scale(${s})`;
  stage.style.height = (poster.offsetHeight * s) + 'px';
  stage.style.width = '960px';
}

/* ---------- 导出图片 ---------- */
async function exportImage(kind) {
  const btn = document.getElementById(kind === 'png' ? 'btnPng' : 'btnJpg');
  const poster = document.getElementById('poster');
  const stage = document.getElementById('stage');
  const prev = stage.style.transform;
  const oldLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = '生成中…';
  try {
    stage.style.transform = 'scale(1)';
    stage.style.height = 'auto';
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    await new Promise(r => setTimeout(r, 120));
    const canvas = await html2canvas(poster, {
      scale: 1.6,   // 约 1536px 宽，微信足够清晰，也不超 Safari 的画布上限
      backgroundColor: T.bg,
      useCORS: true,
      logging: false,
      windowWidth: 960,
      width: 960,
      height: poster.offsetHeight
    });
    // JPG 约 3MB（适合直接传公众号）；PNG 无损但可能 15MB 以上
    const url = kind === 'png' ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg', 0.95);
    const a = document.createElement('a');
    a.href = url;
    a.download = `年度数据_${DATA.year || ''}_${Date.now()}.${kind === 'png' ? 'png' : 'jpg'}`;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => a.remove(), 1500);
    btn.textContent = '已下载 ✓';
    setTimeout(() => { btn.textContent = oldLabel; }, 1800);
  } catch (e) {
    console.error(e);
    alert('导出失败：' + e.message + '\n可以直接用浏览器「打印 → 存储为 PDF」代替。');
    btn.textContent = oldLabel;
  } finally {
    stage.style.transform = prev;
    fit();
    btn.disabled = false;
  }
}

/* 宽容解析：允许行尾 // 注释、块注释、末尾多余逗号（字符串内的 // 不会误伤） */
function stripComments(t) {
  let out = '', inStr = false, esc = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (inStr) {
      out += ch;
      if (esc) esc = false;
      else if (ch === '\\') esc = true;
      else if (ch === '"') inStr = false;
      continue;
    }
    if (ch === '"') { inStr = true; out += ch; continue; }
    if (ch === '/' && t[i + 1] === '/') {
      while (i < t.length && t[i] !== '\n') i++;
      out += '\n';
      continue;
    }
    if (ch === '/' && t[i + 1] === '*') {
      i += 2;
      while (i < t.length && !(t[i] === '*' && t[i + 1] === '/')) i++;
      i++;
      continue;
    }
    out += ch;
  }
  return out;
}
function looseParse(text) {
  return JSON.parse(stripComments(text).replace(/,\s*([}\]])/g, '$1'));
}

/* 输出：标量数组按行折行，方便手改 */
function dump(v, ind = 0) {
  const pad = '  '.repeat(ind), pad2 = '  '.repeat(ind + 1);
  if (Array.isArray(v)) {
    if (v.length && v.every(x => x === null || typeof x !== 'object')) {
      const parts = []; let line = '';
      v.forEach(x => {
        line += (line ? ', ' : '') + JSON.stringify(x);
        if (line.length > 68) { parts.push(line); line = ''; }
      });
      if (line) parts.push(line);
      if (parts.length <= 1) return '[' + parts.join('') + ']';
      return '[\n' + parts.map(p => pad2 + p).join(',\n') + '\n' + pad + ']';
    }
    if (!v.length) return '[]';
    return '[\n' + v.map(x => pad2 + dump(x, ind + 1)).join(',\n') + '\n' + pad + ']';
  }
  if (v && typeof v === 'object') {
    const keys = Object.keys(v);
    if (!keys.length) return '{}';
    return '{\n' + keys.map(k => pad2 + JSON.stringify(k) + ': ' + dump(v[k], ind + 1)).join(',\n') + '\n' + pad + '}';
  }
  return JSON.stringify(v);
}

/* 本地图片：等比缩到 maxW，照片转 JPG，二维码等保留 PNG */
function shrinkImg(file, maxW, png) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, maxW / im.width);
        const w = Math.max(1, Math.round(im.width * k)), h = Math.max(1, Math.round(im.height * k));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.drawImage(im, 0, 0, w, h);
        res(png ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', 0.9));
      };
      im.onerror = () => rej(new Error('图片解码失败'));
      im.src = fr.result;
    };
    fr.onerror = () => rej(new Error('文件读取失败'));
    fr.readAsDataURL(file);
  });
}

function pickFile(p, maxW, png) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.onchange = async () => {
    const file = inp.files && inp.files[0];
    if (!file) return;
    try {
      if (/svg/i.test(file.type)) {
        const t = await file.text();
        sv(p, 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(t));
      } else {
        sv(p, await shrinkImg(file, maxW || 900, png));
      }
      refreshForm();
      queue();
    } catch (e) {
      note('图片处理失败：' + e.message);
    }
  };
  inp.click();
}

function onFormEdit(e) {
  const el = e.target.closest('[data-p]');
  if (!el) return;
  const p = el.dataset.p, t = el.dataset.t;

  // 改年份时，若配色一直是「按年份自动」，就跟着换一套
  if (p === 'year') {
    const oldY = DATA.year;
    const wasAuto = !DATA.theme || DATA.theme === autoTheme(oldY);
    sv('year', Number(el.value) || oldY);
    if (wasAuto) { DATA.theme = autoTheme(DATA.year); applyTheme(DATA.theme); }
    refreshForm();
    render(DATA);
    saveLocal();
    return;
  }

  if (t === 'num') sv(p, el.value === '' ? 0 : Number(el.value));
  else if (t === 'nums') sv(p, el.value.split(/[\s,，、]+/).filter(Boolean).map(Number).filter(n => !isNaN(n)));
  else if (t === 'icon') { if (el.value) sv(p, el.value); else dv(p); }
  else sv(p, el.value);
  queue();
}

function onFormClick(e) {
  const th = e.target.closest('[data-theme]');
  if (th) { setTheme(th.dataset.theme); return; }
  const add = e.target.closest('[data-add]');
  if (add) { addRow(add.dataset.add); return; }
  const del = e.target.closest('[data-del]');
  if (del) {
    const arr = gv(del.dataset.del);
    if (arr) { arr.splice(+del.dataset.i, 1); refreshForm(); queue(); }
    return;
  }
  const clr = e.target.closest('[data-clear]');
  if (clr) { sv(clr.dataset.clear, ''); refreshForm(); queue(); return; }
  const file = e.target.closest('[data-file]');
  if (file) pickFile(file.dataset.file, +file.dataset.max || 900, file.dataset.png === '1');
}

    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === name));

    document.getElementById('paneJson').classList.toggle('on', name === 'json');
  }

  function switchTab(name) {
    if (name === 'form') {
      // 从 JSON 切回来：先试着采用这段 JSON，改坏了就留在 JSON 页签提示
      if (ta.value.trim()) {
        try {
          const next = looseParse(ta.value);
          if (JSON.stringify(next) !== JSON.stringify(DATA)) {
            DATA = next; saveLocal(); refreshForm(); render(DATA);
          }
        } catch (e) {
          paintTab('json');
          note('JSON 还有问题，先改好：' + e.message);
          return;
        }
      }
    }
    paintTab(name);
    if (name === 'json') ta.value = dump(DATA);
  }
  document.querySelectorAll('.tab').forEach(b => { b.onclick = () => switchTab(b.dataset.tab); });

  document.getElementById('btnData').onclick = () => {
    drawer.classList.add('on');
    fit();
    const cur = document.querySelector('.tab.on');
    switchTab(cur ? cur.dataset.tab : 'form');
  };
  document.getElementById('btnClose').onclick = () => { drawer.classList.remove('on'); fit(); };

  document.getElementById('btnApply').onclick = () => {
    const jsonTab = document.querySelector('.tab.on') &&
      document.querySelector('.tab.on').dataset.tab === 'json';
    if (!jsonTab) { flush(); note('已按表单重绘 ✓'); return; }
    try {
      DATA = looseParse(ta.value);
      saveLocal();
      render(DATA);
      refreshForm();
      note('已应用 ✓');
    } catch (e) {
      note('JSON 格式有误：' + e.message);
    }
  };

  document.getElementById('btnReset').onclick = () => {
    if (!confirm('恢复成示例数据？当前填的内容会被覆盖。')) return;
    DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
    localStorage.removeItem(LS_KEY);
    ta.value = dump(DATA);
    refreshForm();
    render(DATA);
    note('已恢复示例数据');
  };

  document.getElementById('btnPng').onclick = () => exportImage('png');
  document.getElementById('btnJpg').onclick = () => exportImage('jpeg');
  window.addEventListener('resize', fit);
}

document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
